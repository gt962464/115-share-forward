services:
  cd2-mount-mover:
    build: .
    container_name: cd2-mount-mover
    restart: unless-stopped
    read_only: true
    user: "0:0"
    environment:
      TZ: Asia/Shanghai
      SOURCE_DIR: /source
      TARGET_DIR: /target
      STATE_FILE: /state/state.json
      PIPELINE_QUEUE_DIR: /pipeline-state/mount-pipeline-queue
      PIPELINE_GROUP_DELAY: "300"
      POLL_INTERVAL: "30"
      STABLE_POLLS: "2"
      LOG_LEVEL: INFO
    volumes:
      - /tmp/115-source:/source:rw
      - /tmp/115-target:/target:rw
      - ./state:/state:rw
      - ../card-bot/state:/pipeline-state:rw
    tmpfs:
      - /tmp
