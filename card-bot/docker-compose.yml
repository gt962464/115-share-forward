services:
  card-bot:
    image: listeningltg/p115-share:latest
    # 覆盖原镜像 entrypoint，直接跑卡片机器人（复用镜像内已装好的 p115client/aiogram）
    entrypoint: ["python", "/cardbot/cardbot.py"]
    container_name: p115-card-bot
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      P115_COOKIE: ${P115_COOKIE}
      P115_SAVE_DIR: ${P115_SAVE_DIR}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHANNEL_ID: ${TG_CHANNEL_ID}
      TG_USER_ID: ${TG_USER_ID}
      TG_ALLOW_CHATS: ${TG_ALLOW_CHATS}
      TG_SUBMITTER_IDS: ${TG_SUBMITTER_IDS:-}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANG: ${TMDB_LANG}
      TG_PROXY: ${TG_PROXY}
      APP_HTTP_PROXY: ${APP_HTTP_PROXY}
      AUTO_PROCESS_115_LINKS: ${AUTO_PROCESS_115_LINKS:-1}
      LOG_LEVEL: ${LOG_LEVEL}
      CLEANUP_STATE_FILE: /cardbot-state/cleanup_queue.json
      RETRY_STATE_FILE: /cardbot-state/retry_queue.json
      PROCESSED_STATE_FILE: /cardbot-state/processed_links.json
      PIPELINE_QUEUE_DIR: /cardbot-state/mount-pipeline-queue
      PIPELINE_P115_COOKIE_FILE: /cardbot/cd2-mount-mover/secrets/p115_pipeline_cookie.txt
      PIPELINE_115_ROOT: /自动转存
      PIPELINE_INTERVAL: "60"
      PIPELINE_GROUP_DELAY: "300"
      PIPELINE_SERIES_DELAY: "1800"
      PIPELINE_TASK_TIMEOUT: "180"
      RECYCLE_PASSWORD: ${RECYCLE_PASSWORD}
      AUTO_DELETE_AFTER: ${AUTO_DELETE_AFTER:-0}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - /vol2/1000/docker/115/card-bot:/cardbot:ro
      - /vol2/1000/docker/115/card-bot/state:/cardbot-state

  tg-user-monitor:
    build: ./tg-monitor
    container_name: tg-user-monitor
    restart: unless-stopped
    env_file:
      - ./tg-monitor/.env
    ports:
      - "18800:18800"
    environment:
      TZ: Asia/Shanghai
      TG_MONITOR_WEB_HOST: 0.0.0.0
      TG_MONITOR_WEB_PORT: 18800
    volumes:
      - ./tg-monitor/state:/tg-monitor-state
