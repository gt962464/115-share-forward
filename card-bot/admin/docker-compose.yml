services:
  card-admin:
    build: .
    container_name: card-admin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "18810:18810"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/project
      - ./data:/admin-data
    environment:
      TZ: Asia/Shanghai
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 18810
      PROJECT_DIR: /project
      ADMIN_DATA_DIR: /admin-data
