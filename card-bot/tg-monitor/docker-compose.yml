services:
  tg-user-monitor:
    build: .
    container_name: tg-user-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./state:/tg-monitor-state
    ports:
      - "127.0.0.1:18800:18800"
    environment:
      TZ: Asia/Shanghai
      TG_MONITOR_WEB_HOST: 0.0.0.0
      TG_MONITOR_WEB_PORT: 18800
