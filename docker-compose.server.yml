# ============================================
# 115 分享转发 · 服务器部署 Compose
# 适配美国服务器（无 NAS 挂载路径）
# 跳过 cd2-mount-mover（NAS 专用）
# 端口：18800(tg-monitor 监听转发登录) / 18810(后台API) / 18811(前端面板)
# ============================================

services:
  # ── 核心卡片机器人 ──
  p115-card-bot:
    build:
      context: .
      dockerfile: card-bot/Dockerfile
    container_name: p115-card-bot
    restart: unless-stopped
    entrypoint: ["python", "/cardbot/cardbot.py"]
    working_dir: /app
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      CLEANUP_STATE_FILE: /cardbot-state/cleanup_queue.json
      RETRY_STATE_FILE: /cardbot-state/retry_queue.json
      PROCESSED_STATE_FILE: /cardbot-state/processed_links.json
      PIPELINE_QUEUE_DIR: /cardbot-state/mount-pipeline-queue
      PIPELINE_115_ROOT: /自动转存
      PIPELINE_INTERVAL: "60"
      PIPELINE_GROUP_DELAY: "300"
      PIPELINE_SERIES_DELAY: "1800"
      PIPELINE_TASK_TIMEOUT: "180"
    volumes:
      - ./card-bot:/cardbot:ro
      - ./data/cardbot-state:/cardbot-state

  # ── 管理后台 API ──
  card-admin:
    build: ./card-bot/admin
    container_name: card-admin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18810:18810"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./card-bot:/project
      - ./data/admin-data:/admin-data
    environment:
      TZ: Asia/Shanghai
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 18810
      PROJECT_DIR: /project
      ADMIN_DATA_DIR: /admin-data

  # ── 前端面板 ──
  card-admin-web:
    build: ./frontend
    container_name: card-admin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18811:80"
    environment:
      TZ: Asia/Shanghai

  # ── Telegram 监听转发（可选）──
  # 用你的真实 Telegram 用户账号监听来源聊天，把 115 链接转发给卡片机器人
  tg-user-monitor:
    build: ./card-bot/tg-monitor
    container_name: tg-user-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18800:18800"
    environment:
      TZ: Asia/Shanghai
      TG_MONITOR_WEB_HOST: 0.0.0.0
      TG_MONITOR_WEB_PORT: 18800
    volumes:
      - ./data/tg-monitor-state:/tg-monitor-state